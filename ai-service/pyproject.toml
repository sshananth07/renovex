[project]
name = "renovex-ai-service"
version = "0.1.0"
description = "Renovex AI Scope & Resource Preview — internal Python FastAPI AI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-genai>=0.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
markers = [
    "gemini: real Gemini synthetic smoke test, requires GEMINI_API_KEY (skipped by default)",
    "glm: real GLM-5.3 synthetic smoke test, requires GLM_API_KEY (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
