name: CI

# T3A: smallest maintainable CI gate before Vercel is connected. Every job
# reuses the exact commands a developer already runs locally (see CLAUDE.md
# and each package's own package.json/pyproject.toml) — no new build
# framework, no live external AI/email provider calls. The Go job's tests
# use real ephemeral local Mongo (testcontainers, via GitHub Actions' own
# pre-installed Docker) and a Mailpit service container — both are local
# infrastructure this repo's own docker-compose.yml already uses for dev,
# never a real external provider.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go backend (fast)
    runs-on: ubuntu-latest
    # T3A repair: the full `go test ./...` (Mongo-testcontainers/Mailpit
    # integration suite) previously ran HERE and took >22 minutes,
    # dominated by a handful of packages (spatial ~238s, supplieroffers
    # ~459s, tenanttest timing out at 600s) — see integration.yml, which
    # now owns that suite on its own separate trigger. This job stays fast
    # by running ONLY with -short, which every Mongo/Docker-backed test's
    # own shared setup helper (setupMongoDB/setupDB/setupRouterWithMail/
    # etc.) now skips via `if testing.Short() { t.Skip(...) }` — ordinary
    # unit/domain tests are unaffected and keep running here.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: go mod download
        run: go mod download

      - name: go test -short
        # Intentionally NOT -count=1 — this fast job wants Go's normal
        # successful-test-result cache on re-runs of an unchanged package.
        # Default -parallel/-p (GOMAXPROCS-based) — no override; nothing
        # here has been measured to benefit from a non-default value.
        run: go test -short ./...

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: unit tests
        # vitest run, not playwright — playwright/e2e stays a separate,
        # not-yet-added concern per this task's own scope (no huge slow
        # regression requirement for an already-expensive suite).
        run: npm test

      - name: build
        run: npm run build

  python:
    name: Python AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check app tests

      - name: pytest
        # AI_PROVIDER/SPATIAL_AI_PROVIDER/REFERENCE_IMAGE_PROVIDER all
        # default to "mock" (see app/config.py) — no real Gemini/GLM/
        # Cloudflare credential is read or required. The 3 real-Gemini
        # smoke tests self-skip via skipif when GEMINI_API_KEY is unset,
        # which it deliberately is not set here.
        run: pytest -q
        env:
          INTERNAL_API_TOKEN: ci-placeholder-token

  contracts:
    name: OpenAPI/Web client freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        working-directory: apps/web
        run: npm ci

      - name: regenerate OpenAPI from the current Go handlers
        working-directory: backend
        run: go run ./cmd/openapi -out ../apps/web/openapi/openapi.json

      - name: regenerate the Web TypeScript client from that OpenAPI doc
        working-directory: apps/web
        run: npm run openapi:generate

      - name: fail if regeneration produced any diff
        # The committed openapi.json/schema.ts must already be exactly what
        # today's Go handlers + the existing generation commands produce —
        # if regenerating changes anything, the committed files are stale
        # and were not regenerated before commit (see this task's own T3A
        # requirement).
        run: |
          if ! git diff --quiet -- apps/web/openapi/openapi.json apps/web/src/lib/api/generated/schema.ts; then
            echo "::error::Generated OpenAPI/Web client files are stale. Run 'go run ./cmd/openapi -out ../apps/web/openapi/openapi.json' (from backend/) then 'npm run openapi:generate' (from apps/web/) and commit the result."
            git diff -- apps/web/openapi/openapi.json apps/web/src/lib/api/generated/schema.ts
            exit 1
          fi

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: no tracked real env files
        # .env.example files are expected and fine; a real .env/.env.local
        # (or any .env.*.local) must never be committed. This is a static
        # check of what's actually tracked in the checkout, not a secret
        # scanner — it complements, not replaces, .gitignore.
        run: |
          matches=$(git ls-files | grep -E '(^|/)\.env(\.[^.]+)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$matches" ]; then
            echo "::error::Tracked real env file(s) found — these must never be committed:"
            echo "$matches"
            exit 1
          fi
          echo "no tracked .env files besides .env.example"

      - name: no tracked build/cache artifacts
        run: |
          matches=$(git ls-files | grep -E '(^|/)(__pycache__|\.venv|node_modules|\.next|\.pytest_cache|\.ruff_cache|egg-info)(/|$)|\.pyc$' || true)
          if [ -n "$matches" ]; then
            echo "::error::Tracked build/cache artifact(s) found — add to .gitignore and untrack:"
            echo "$matches"
            exit 1
          fi
          echo "no tracked build/cache artifacts"
